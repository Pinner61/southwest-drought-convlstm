seed: 0
out_dir: outputs_real
data:
  source: gridmet
  bbox:
    lat: [31.0, 37.0]        # US Southwest (AZ / NM / S. Nevada)
    lon: [-115.0, -107.0]
  years: [1990, 2024]
  frac_train: 0.7            # ~ train <=2013, val 2014-2017, test 2018-2024
  frac_val: 0.15
model:
  seq_len: 6                 # 6 months of history -> next month
  hidden: 48
  pixel_hidden: 96
  layers: 2
train:
  epochs: 60
  batch: 8
  lr: 0.001
